<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>chrome://dino</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: #f7f7f7;
    color: #535353;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    touch-action: manipulation;
  }
  body.dark {
    background-color: #202124;
    color: #f1f3f4;
  }
  #header {
    position: absolute;
    top: 24px;
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.5px;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 200px;
  }
  canvas {
    background: transparent;
    display: block;
    width: 100%;
    height: 200px;
  }
  #tapHint {
    margin-top: 16px;
    font-size: 13px;
    color: #70757a;
  }
</style>
</head>
<body>
  <div id="header">
    <strong>No Internet</strong> &mdash; chrome://dino
  </div>
  <div id="gameContainer">
    <canvas id="canvas" width="600" height="200"></canvas>
  </div>
  <div id="tapHint">Press Space or Tap Screen to Jump</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  
  let score = 0;
  let highScore = parseInt(localStorage.getItem('dino_hi') || '0', 10);
  let isGameOver = false;
  let isPlaying = false;
  let gameSpeed = 6;
  let frame = 0;

  const groundY = 160;
  
  const dino = {
    x: 40,
    y: groundY - 40,
    w: 36,
    h: 40,
    vy: 0,
    gravity: 0.85,
    jumpPower: -13.5,
    isGrounded: true,
    step: 0
  };

  const obstacles = [];
  const clouds = [
    { x: 120, y: 40, speed: 0.5 },
    { x: 340, y: 65, speed: 0.7 },
    { x: 520, y: 30, speed: 0.6 }
  ];

  function drawDino() {
    ctx.fillStyle = document.body.classList.contains('dark') ? '#f1f3f4' : '#535353';
    // Body & head
    ctx.fillRect(dino.x + 12, dino.y, 24, 20); // Head
    ctx.fillRect(dino.x + 8, dino.y + 14, 20, 18); // Body
    ctx.fillRect(dino.x, dino.y + 18, 10, 10); // Tail
    
    // Eye
    ctx.fillStyle = document.body.classList.contains('dark') ? '#202124' : '#f7f7f7';
    ctx.fillRect(dino.x + 28, dino.y + 4, 3, 3);
    
    // Legs
    ctx.fillStyle = document.body.classList.contains('dark') ? '#f1f3f4' : '#535353';
    if (!dino.isGrounded) {
      ctx.fillRect(dino.x + 12, dino.y + 32, 4, 8);
      ctx.fillRect(dino.x + 20, dino.y + 32, 4, 6);
    } else {
      if (Math.floor(dino.step / 6) % 2 === 0) {
        ctx.fillRect(dino.x + 12, dino.y + 32, 4, 8);
        ctx.fillRect(dino.x + 20, dino.y + 32, 4, 4);
      } else {
        ctx.fillRect(dino.x + 12, dino.y + 32, 4, 4);
        ctx.fillRect(dino.x + 20, dino.y + 32, 4, 8);
      }
    }
  }

  function drawGround() {
    ctx.strokeStyle = document.body.classList.contains('dark') ? '#5f6368' : '#c4c7c5';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.stroke();

    // ground dashes
    ctx.fillStyle = ctx.strokeStyle;
    const offset = (frame * gameSpeed) % 40;
    for (let x = -offset; x < canvas.width; x += 40) {
      ctx.fillRect(x, groundY + 4, 12, 1);
      ctx.fillRect(x + 22, groundY + 8, 8, 1);
    }
  }

  function drawClouds() {
    ctx.fillStyle = document.body.classList.contains('dark') ? '#3c4043' : '#dadce0';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 10, 0, Math.PI * 2);
      ctx.arc(c.x + 10, c.y - 4, 12, 0, Math.PI * 2);
      ctx.arc(c.x + 22, c.y, 10, 0, Math.PI * 2);
      ctx.fill();
      c.x -= c.speed;
      if (c.x < -40) c.x = canvas.width + Math.random() * 80;
    });
  }

  function drawObstacles() {
    ctx.fillStyle = document.body.classList.contains('dark') ? '#f1f3f4' : '#535353';
    obstacles.forEach(o => {
      // Cactus
      ctx.fillRect(o.x, groundY - o.h, o.w, o.h);
      ctx.fillRect(o.x - 4, groundY - o.h + 8, 4, 12);
      ctx.fillRect(o.x + o.w, groundY - o.h + 12, 4, 10);
    });
  }

  function drawScore() {
    ctx.font = '14px monospace';
    ctx.fillStyle = document.body.classList.contains('dark') ? '#9aa0a6' : '#70757a';
    const sStr = String(Math.floor(score)).padStart(5, '0');
    const hiStr = String(Math.floor(highScore)).padStart(5, '0');
    ctx.fillText(`HI ${hiStr}  ${sStr}`, canvas.width - 150, 24);
  }

  function jump() {
    if (isGameOver) {
      restart();
      return;
    }
    if (!isPlaying) {
      isPlaying = true;
    }
    if (dino.isGrounded) {
      dino.vy = dino.jumpPower;
      dino.isGrounded = false;
    }
  }

  function restart() {
    score = 0;
    obstacles.length = 0;
    isGameOver = false;
    isPlaying = true;
    gameSpeed = 6;
    dino.y = groundY - dino.h;
    dino.vy = 0;
    dino.isGrounded = true;
  }

  function update() {
    frame++;
    if (isPlaying && !isGameOver) {
      score += 0.15;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('dino_hi', Math.floor(highScore));
      }

      // Night mode every 700 points
      if (Math.floor(score / 500) % 2 === 1) {
        document.body.classList.add('dark');
      } else {
        document.body.classList.remove('dark');
      }

      // Speed progression
      gameSpeed = 6 + Math.min(8, score / 200);

      // Dino physics
      dino.vy += dino.gravity;
      dino.y += dino.vy;
      if (dino.y >= groundY - dino.h) {
        dino.y = groundY - dino.h;
        dino.vy = 0;
        dino.isGrounded = true;
      }
      dino.step++;

      // Spawn obstacles
      if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - (180 + Math.random() * 220)) {
        const height = 30 + Math.floor(Math.random() * 18);
        obstacles.push({
          x: canvas.width + 20,
          w: 16,
          h: height
        });
      }

      // Move obstacles & collision check
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= gameSpeed;

        // Collision box
        if (
          dino.x + 4 < o.x + o.w &&
          dino.x + dino.w - 4 > o.x &&
          dino.y + dino.h > groundY - o.h
        ) {
          isGameOver = true;
        }

        if (o.x < -30) {
          obstacles.splice(i, 1);
        }
      }
    }

    // Render
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawClouds();
    drawGround();
    drawDino();
    drawObstacles();
    drawScore();

    if (isGameOver) {
      ctx.font = 'bold 16px sans-serif';
      ctx.fillStyle = document.body.classList.contains('dark') ? '#f1f3f4' : '#535353';
      ctx.textAlign = 'center';
      ctx.fillText('G A M E   O V E R', canvas.width / 2, 85);
      ctx.font = '12px sans-serif';
      ctx.fillText('Tap to restart', canvas.width / 2, 110);
      ctx.textAlign = 'left';
    }

    requestAnimationFrame(update);
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    }
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    jump();
  }, { passive: false });

  canvas.addEventListener('mousedown', () => {
    jump();
  });

  update();
})();
</script>
</body>
</html>
